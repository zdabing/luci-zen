name: Frontend APK release

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: OpenWrt SDK version
        default: '25.12.5'
      sdk_target:
        description: SDK target/subtarget (frontend output is architecture all)
        default: x86/64
      publish_release:
        description: Publish a stable frontend release after a successful build
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SDK_VERSION: ${{ inputs.sdk_version }}
      SDK_TARGET: ${{ inputs.sdk_target }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare SDK build host
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file zstd curl ca-certificates

      - name: Download and verify SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/$SDK_VERSION/targets/$SDK_TARGET"
          curl -fsSL --retry 3 "$BASE/sha256sums" -o sha256sums
          SDK_FILE=$(grep -oE 'openwrt-sdk-[^ ]+\.tar\.zst' sha256sums | head -n1)
          test -n "$SDK_FILE"
          grep -F "$SDK_FILE" sha256sums > sdk.sha256
          curl -fsSL --retry 3 "$BASE/$SDK_FILE" -o "$SDK_FILE"
          sha256sum -c sdk.sha256
          tar --zstd -xf "$SDK_FILE"
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)
          test -n "$SDK_DIR"
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Build frontend APK
        working-directory: ${{ env.SDK_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base rust libubus libubox bpf-headers
          cp -R "$GITHUB_WORKSPACE/luci-app-zen" "$GITHUB_WORKSPACE/luci-zen" package/
          echo 'CONFIG_PACKAGE_luci-zen=m' >> .config
          echo 'CONFIG_PACKAGE_luci-app-zen=m' >> .config
          make defconfig
          make package/luci-app-zen/compile V=s -j"$(nproc)"

      - name: Verify APK and prepare release metadata
        id: package
        run: |
          mkdir out
          find "$SDK_DIR/bin/packages" -type f -name 'luci-app-zen-*.apk' -exec cp {} out/ \;
          test "$(find out -name '*.apk' | wc -l)" -eq 1
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          source = Path('luci-app-zen/Makefile').read_text()
          version = re.search(r'^PKG_VERSION:=(.+)$', source, re.M)[1].strip()
          revision = re.search(r'^PKG_RELEASE:=(\d+)$', source, re.M)[1]
          tag = f'frontend-v{version}-r{revision}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nversion={version}-r{revision}\n')
          Path('out/sources.tsv').write_text(
              f'Zen\t{os.environ["GITHUB_SHA"]}\nSDK\t{os.environ["SDK_VERSION"]}\nTarget\t{os.environ["SDK_TARGET"]}\n')
          PY
          TAG=$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT")
          python3 scripts/make-release-notes.py --tag "$TAG" --sdk-version "$SDK_VERSION" \
            --target "$SDK_TARGET" --commit "$GITHUB_SHA"
          python3 scripts/make-release-metadata.py --assets out --target "$SDK_TARGET" \
            --sdk-version "$SDK_VERSION" --tag "$TAG" --notes release-notes.md --packages luci-app-zen
          (cd out && sha256sum ./*.apk > SHA256SUMS && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: zen-frontend-apk-${{ github.run_id }}
          path: out/
          if-no-files-found: error

      - name: Publish stable frontend release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Zen interface ${{ steps.package.outputs.version }}
          prerelease: false
          body_path: release-notes.md
          files: |
            out/*.apk
            out/zen-update.json
            out/SHA256SUMS
            out/sources.tsv
          fail_on_unmatched_files: true
