# Validate production source only. Local test suites and fixtures are not published.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Backend Rust check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: luci-zen
      - name: Check backend source
        working-directory: luci-zen
        run: cargo check --workspace

  ebpf-compile:
    name: Backend eBPF check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prepare BPF compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev linux-libc-dev
      - name: Check production BPF source
        run: |
          clang -O2 -g -target bpf -I/usr/include/x86_64-linux-gnu \
            -c luci-zen/bpf/zen_traffic.bpf.c -o "$RUNNER_TEMP/zen_traffic.bpf.o"

  frontend-check:
    name: Frontend and release script checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check frontend translations and JavaScript
        run: |
          node scripts/check-po.js luci-app-zen
          find luci-app-zen/htdocs -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Check package JSON and release scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 - <<'PY'
          import ast, json
          from pathlib import Path
          for folder in ('luci-app-zen', 'luci-zen'):
              for path in Path(folder).rglob('*.json'):
                  json.loads(path.read_text(encoding='utf-8'))
          for path in Path('scripts').glob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
