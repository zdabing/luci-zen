# CI：push / PR 时跑 Rust 检查 + eBPF 对象编译 + .po 校验。
# SDK 正式编译见 build.yml（tag / release / 手动触发）。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust check (zen-traffic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zen-traffic

      - name: cargo check
        working-directory: zen-traffic
        run: cargo check --workspace

      - name: Build matching libubox and libubus for unit tests
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libjson-c-dev clang libbpf-dev iproute2
          PREFIX="$RUNNER_TEMP/zen-ubus"
          git clone https://github.com/openwrt/libubox.git "$RUNNER_TEMP/libubox"
          git -C "$RUNNER_TEMP/libubox" checkout 7dd127841e82eb1cfb61185da37dde7b9bd9ba6d
          cmake -S "$RUNNER_TEMP/libubox" -B "$RUNNER_TEMP/libubox-build" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DBUILD_LUA=OFF -DBUILD_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/libubox-build" -j2
          cmake --install "$RUNNER_TEMP/libubox-build"
          git clone https://github.com/openwrt/ubus.git "$RUNNER_TEMP/ubus"
          git -C "$RUNNER_TEMP/ubus" checkout 24864e7840b3a02a9ef76284a373f6b2f00b8a9b
          cmake -S "$RUNNER_TEMP/ubus" -B "$RUNNER_TEMP/ubus-build" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DBUILD_LUA=OFF -DBUILD_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/ubus-build" -j2
          cmake --install "$RUNNER_TEMP/ubus-build"
          echo "UBUS_LIB_DIR=$PREFIX/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PREFIX/lib" >> "$GITHUB_ENV"

      - name: Verify C headers against Rust FFI layout
        run: |
          cc -I"$RUNNER_TEMP/zen-ubus/include" -c \
            zen-traffic/crates/zen-ubus-sys/abi-check.c -o "$RUNNER_TEMP/ubus-abi-check.o"

      - name: Verify AArch64 musl FFI layout
        run: |
          # Same libc release/hash as the deployed OpenWrt 6ad13aa toolchain.
          curl -fsSL --retry 3 https://musl.libc.org/releases/musl-1.2.5.tar.gz \
            -o "$RUNNER_TEMP/musl-1.2.5.tar.gz"
          printf '%s  %s\n' \
            a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4 \
            "$RUNNER_TEMP/musl-1.2.5.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/musl-1.2.5.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/musl-1.2.5" ARCH=aarch64 \
            prefix="$RUNNER_TEMP/musl-aarch64" install-headers
          clang --target=aarch64-linux-musl -nostdinc \
            -isystem "$(clang -print-resource-dir)/include" \
            -isystem "$RUNNER_TEMP/musl-aarch64/include" \
            -I"$RUNNER_TEMP/zen-ubus/include" -c \
            zen-traffic/crates/zen-ubus-sys/abi-check.c -o "$RUNNER_TEMP/ubus-abi-aarch64.o"

      - name: cargo test
        working-directory: zen-traffic
        run: cargo test --workspace

      - name: Real kernel two-interface attachment regression
        working-directory: zen-traffic
        run: |
          clang -O2 -g -target bpf -I/usr/include/x86_64-linux-gnu \
            -c bpf/zen_traffic.bpf.c -o "$RUNNER_TEMP/zen-multi-interface.bpf.o"
          cargo test -p zen-bpf --test multi_interface --no-run --message-format=json \
            > "$RUNNER_TEMP/zen-multi-interface-test.jsonl"
          TEST_BINARY=$(python3 -c 'import json,sys; rows=[json.loads(line) for line in open(sys.argv[1])]; print(next(row["executable"] for row in rows if row.get("executable") and row.get("target",{}).get("name")=="multi_interface"))' "$RUNNER_TEMP/zen-multi-interface-test.jsonl")
          sudo env ZEN_BPF_TEST_OBJECT="$RUNNER_TEMP/zen-multi-interface.bpf.o" \
            "$TEST_BINARY" --nocapture

  ebpf-compile:
    name: eBPF compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install clang / libbpf headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld libbpf-dev

      - name: Compile read-only AArch64 TC attachment helper
        run: |
          clang --target=aarch64-linux-gnu -Os -ffreestanding -fno-stack-protector \
            -nostdlib -static -fuse-ld=lld -Wall -Wextra -Werror \
            tools/tc-filter-dump-aarch64.c -o tc-filter-dump

      - name: Compile and verify process-only acceptance clock
        run: |
          clang --target=aarch64-linux-gnu -O2 -fPIC -shared -nostdlib \
            -fno-stack-protector -fuse-ld=lld -Wall -Wextra -Werror \
            tools/router-test-clock.c -o router-test-clock-aarch64.so
          cc -O2 -fPIC -shared -nostdlib -fno-stack-protector -Wall -Wextra -Werror \
            tools/router-test-clock.c -o router-test-clock-native.so
          python3 tools/test-router-clock.py ./router-test-clock-native.so
          sha256sum router-test-clock-aarch64.so tc-filter-dump > router-fixture-SHA256SUMS

      - name: Retain private-fixture binaries
        uses: actions/upload-artifact@v7
        with:
          name: router-fixture-tools-${{ github.run_id }}
          path: |
            router-test-clock-aarch64.so
            tc-filter-dump
            router-fixture-SHA256SUMS
          retention-days: 7

      # 正式数据面（zen-traffic/Makefile 内 bpf.mk 同参数：-O2 -g -target bpf）
      # -I/usr/include/x86_64-linux-gnu：bpf target 下 linux/types.h 找不到 asm/types.h
      - name: Compile zen_traffic.bpf.c (zen-traffic)
        run: |
          clang -O2 -g -target bpf -I/usr/include/x86_64-linux-gnu \
            -c zen-traffic/bpf/zen_traffic.bpf.c \
            -o zen_traffic.bpf.o
          file zen_traffic.bpf.o

      # PoC 数据面与正式包同源，保持可编译
      - name: Compile poc/bpf/zen_traffic.bpf.c
        run: |
          clang -O2 -g -target bpf -I/usr/include/x86_64-linux-gnu \
            -c poc/bpf/zen_traffic.bpf.c \
            -o poc_zen_traffic.bpf.o
          file poc_zen_traffic.bpf.o

  po-check:
    name: i18n .po check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run check-po.js
        run: node tools/check-po.js luci-theme-zen

      - name: App translations and dashboard regression
        run: |
          python3 tools/test-package-assets.py
          node tools/check-po.js luci-app-zen-traffic
          node tools/test-dashboard-history.cjs
          node tools/test-wan-share.cjs
          node tools/test-device-actions.cjs
          node tools/test-device-history.cjs
          node tools/test-history-bars.cjs
          node tools/test-homepage-history-bars.cjs
          node tools/test-realtime-chart-hover.cjs
          node tools/test-realtime-query.cjs

      - name: SQLite retention and realtime regression
        run: |
          python3 -m py_compile tools/router-baseline.py
          python3 -m py_compile tools/router-storage-acceptance.py
          python3 tools/test-sqlite-retention.py
          python3 tools/test-realtime-history.py
