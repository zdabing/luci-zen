name: R5C pinned package acceptance

on:
  workflow_dispatch:
  push:
    branches: [codex/router-acceptance]
    paths:
      - '.github/workflows/r5c-acceptance.yml'
      - 'tools/r5c-acceptance-build.sh'
      - 'zen-traffic/**'
      - 'luci-app-zen-traffic/**'
      - 'luci-theme-zen/**'

permissions:
  contents: read

concurrency:
  group: r5c-package-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Prepare build host
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm lld flex bison g++ gawk gcc-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev python3 \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file zstd curl ca-certificates bc
          df -h
      - name: Build with deployed OpenWrt and feed revisions
        run: bash tools/r5c-acceptance-build.sh
      - name: Retain package and timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r5c-package-acceptance-${{ github.run_id }}
          path: acceptance-out/
          if-no-files-found: warn
          retention-days: 7
