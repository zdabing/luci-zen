# OpenWrt 25 SDK 正式编译：tag（v*）或手动触发。
# 单个 SDK 构建四个包，统一发布到 GitHub Releases；主题独立发布见 theme-apk.yml。
#
# 只打 .apk 包（OpenWrt 25 默认 apk 包管理器）。必须走 SDK 交叉编译（rust-package.mk 导出 target cargo/linker、
# bpf.mk 走 llvm-bpf 工具链），不允许用普通 Linux binary 代替。
#
# 标签发布和手动构建默认同时构建 x86/64 和 rockchip/armv8。
# 不同版本/目标使用独立签名软件源。
name: SDK Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'OpenWrt release version'
        default: '25.12.5'
      sdk_target:
        description: 'SDK targets: both = x86/64 + rockchip/armv8; or one target/subtarget'
        default: 'both'
      publish_repository:
        description: 'Publish signed SDK-specific APK feed (requires ZEN_APK_SIGNING_KEY secret)'
        type: boolean
        default: false
      publish_release:
        description: 'Publish packages after building (disable for router acceptance)'
        type: boolean
        default: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  zen-traffic:
    name: "SDK build Zen suite (${{ matrix.sdk_target }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sdk_target: ${{ inputs.sdk_target && inputs.sdk_target != 'both' && fromJSON(format('["{0}"]', inputs.sdk_target)) || fromJSON('["x86/64","rockchip/armv8"]') }}
    env:
      SDK_VERSION: ${{ inputs.sdk_version || '25.12.5' }}
      SDK_TARGET: ${{ matrix.sdk_target }}
      SDK_BASE: https://downloads.openwrt.org/releases
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('build-{0}-{1}', github.run_id, github.run_attempt) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync unzip \
            zlib1g-dev file zstd curl ca-certificates

      - name: Download & verify SDK
        run: |
          BASE="$SDK_BASE/$SDK_VERSION/targets/$SDK_TARGET"
          curl -sfL --retry 3 "$BASE/sha256sums" -o sha256sums
          SDK_FILE=$(grep -oE 'openwrt-sdk-[^ ]+\.tar\.zst' sha256sums | head -n1)
          [ -n "$SDK_FILE" ] || { echo "SDK tarball not found in sha256sums"; exit 1; }
          grep "$SDK_FILE" sha256sums > wanted.sha
          curl -sfL --retry 3 "$BASE/$SDK_FILE" -O
          sha256sum -c wanted.sha
          tar --zstd -xf "$SDK_FILE"
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)
          [ -n "$SDK_DIR" ] || { echo "SDK directory not found"; exit 1; }
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Download & unpack llvm-bpf toolchain
        run: |
          BASE="$SDK_BASE/$SDK_VERSION/targets/$SDK_TARGET"
          LLVM_FILE=$(grep -oE 'llvm-bpf-[^ ]+\.tar\.zst' sha256sums | head -n1)
          [ -n "$LLVM_FILE" ] || { echo "llvm-bpf tarball not found in sha256sums"; exit 1; }
          grep "$LLVM_FILE" sha256sums > wanted-llvm.sha
          curl -sfL --retry 3 "$BASE/$LLVM_FILE" -O
          sha256sum -c wanted-llvm.sha
          # 解压进 SDK 根目录（含 staging_dir/host/llvm-bpf-*，bpf.mk 所用）
          tar --zstd -xf "$LLVM_FILE" -C "$SDK_DIR"

      - name: Prepare feeds
        working-directory: ${{ env.SDK_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install rust libubus libubox clang bpf-headers luci-base

      - name: Use verified Rust CI LLVM when available
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -euo pipefail
          RUST_MAKEFILE=feeds/packages/lang/rust/Makefile
          RUST_VERSION=$(sed -n 's/^PKG_VERSION:=//p' "$RUST_MAKEFILE")
          # Rust 1.96.0 的官方 CI LLVM 构件仍可下载，省去本地编译 LLVM。
          # feed 更新版本或构件失效时保持 OpenWrt 的源码编译默认行为。
          CI_LLVM_URL=https://ci-artifacts.rust-lang.org/rustc-builds/ac68faa20c58cbccd01ee7208bf3b6e93a7d7f96/rust-dev-1.96.0-x86_64-unknown-linux-gnu.tar.xz
          if [ "$RUST_VERSION" = 1.96.0 ] && \
             grep -qF -- '--set=llvm.download-ci-llvm=false' "$RUST_MAKEFILE" && \
             curl -fsSIL --retry 2 "$CI_LLVM_URL" >/dev/null; then
            sed -i 's/--set=llvm.download-ci-llvm=false/--set=llvm.download-ci-llvm=true/' "$RUST_MAKEFILE"
            echo 'Rust 1.96.0: 使用官方 CI LLVM，跳过本地 LLVM 编译'
          else
            echo "Rust $RUST_VERSION: 沿用 OpenWrt 默认 LLVM 源码编译"
          fi

      - name: Install packages & configure
        working-directory: ${{ env.SDK_DIR }}
        run: |
          cp -r "$GITHUB_WORKSPACE/zen-traffic" package/
          cp -r "$GITHUB_WORKSPACE/luci-app-zen-traffic" package/
          cp -r "$GITHUB_WORKSPACE/zen-full" package/
          cp -r "$GITHUB_WORKSPACE/luci-theme-zen" package/
          echo 'CONFIG_PACKAGE_zen-traffic=m' >> .config
          echo 'CONFIG_PACKAGE_luci-app-zen-traffic=m' >> .config
          echo 'CONFIG_PACKAGE_zen-full=m' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-zen=m' >> .config
          make defconfig

      - name: Restore Rust host toolchain cache
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.SDK_DIR }}/staging_dir/target-*/host
            ${{ env.SDK_DIR }}/staging_dir/hostpkg/stamp/.rust_installed
            ${{ env.SDK_DIR }}/build_dir/target-*/host/rustc-*
          key: rust-host-${{ runner.os }}-${{ env.SDK_VERSION }}-${{ env.SDK_TARGET }}-${{ hashFiles('**/feeds/packages/lang/rust/Makefile') }}

      - name: Build Rust host toolchain
        if: steps.rust-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.SDK_DIR }}
        run: make package/feeds/packages/rust/host/compile V=s -j"$(nproc)"

      - name: Restore cached Rust host build state
        if: steps.rust-cache.outputs.cache-hit == 'true'
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -euo pipefail
          test -f staging_dir/hostpkg/stamp/.rust_installed
          rustc_bin=$(find staging_dir -path '*/host/bin/rustc' -print -quit)
          cargo_bin=$(find staging_dir -path '*/host/bin/cargo' -print -quit)
          test -x "$rustc_bin" && test -x "$cargo_bin"
          "$rustc_bin" --version
          "$cargo_bin" --version
          # OpenWrt cleans the Rust source tree after host install. Fetch the
          # source archive with the feed's pinned hash, then recreate stamps.
          rust_makefile=feeds/packages/lang/rust/Makefile
          rust_version=$(sed -n 's/^PKG_VERSION:=//p' "$rust_makefile")
          rust_hash=$(sed -n 's/^PKG_HASH:=//p' "$rust_makefile")
          test -n "$rust_version" && test -n "$rust_hash"
          rust_source="rustc-${rust_version}-src.tar.xz"
          curl -fsSL --retry 3 "https://static.rust-lang.org/dist/$rust_source" -o "dl/$rust_source"
          printf '%s  %s\n' "$rust_hash" "dl/$rust_source" | sha256sum -c -
          make package/feeds/packages/rust/host/configure V=s
          rust_src_dir=$(find build_dir -path '*/host/rustc-*-src' -type d -print -quit)
          test -n "$rust_src_dir"
          touch "$rust_src_dir/.built"
          touch staging_dir/hostpkg/stamp/.rust_installed
          make package/feeds/packages/rust/host/compile V=s -j"$(nproc)"

      - name: Save Rust host toolchain cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.SDK_DIR }}/staging_dir/target-*/host
            ${{ env.SDK_DIR }}/staging_dir/hostpkg/stamp/.rust_installed
            ${{ env.SDK_DIR }}/build_dir/target-*/host/rustc-*
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Build
        working-directory: ${{ env.SDK_DIR }}
        run: make package/zen-traffic/compile package/luci-app-zen-traffic/compile package/zen-full/compile package/luci-theme-zen/compile V=s -j"$(nproc)"

      - name: Collect artifacts
        working-directory: ${{ env.SDK_DIR }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find bin/packages -type f \( -name 'zen-traffic-*.apk' -o -name 'luci-app-zen-traffic-*.apk' -o -name 'zen-full-*.apk' -o -name 'luci-theme-zen-*.apk' \) \
            -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          test "$(find "$GITHUB_WORKSPACE/out" -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 4
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Prepare target-specific release assets
        run: |
          suffix="${SDK_TARGET//\//-}"
          for file in out/*.apk; do
            mv "$file" "${file%.apk}-${suffix}.apk"
          done
          python3 tools/make-release-metadata.py --assets out --target "$SDK_TARGET" \
            --sdk-version "$SDK_VERSION" --tag "$RELEASE_TAG" --notes build-metadata-notes.md \
            --filename-suffix "$suffix"

      - uses: actions/upload-artifact@v7
        with:
          name: zen-suite-apk-${{ strategy.job-index }}
          path: out/

      - name: Build signed repository
        if: inputs.publish_repository
        env:
          ZEN_APK_SIGNING_KEY: ${{ secrets.ZEN_APK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$ZEN_APK_SIGNING_KEY" || { echo 'Configure ZEN_APK_SIGNING_KEY before publishing'; exit 1; }
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$ZEN_APK_SIGNING_KEY" > "$key"
          mkdir repository
          suffix="${SDK_TARGET//\//-}"
          for file in out/*.apk; do
            filename=$(basename "$file")
            cp "$file" "repository/${filename%-${suffix}.apk}.apk"
          done
          build_tag="feed-build-${SDK_VERSION}-${SDK_TARGET//\//-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export APK_PACKAGE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${build_tag}"
          printf '%s\n' "$build_tag" > repository/build-tag.txt
          bash tools/build-apk-repository.sh "$SDK_DIR/staging_dir/host/bin/apk" "$key" repository

      - uses: actions/upload-artifact@v7
        if: inputs.publish_repository
        with:
          name: zen-signed-repository-${{ strategy.job-index }}
          path: repository/
          if-no-files-found: error

  publish:
    name: Publish APKs to Releases
    needs: [zen-traffic]
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_release) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: zen-suite-apk-*
          path: release-assets

      - name: Verify release assets
        run: |
          count=$(find release-assets -mindepth 2 -maxdepth 2 -name zen-update.json | wc -l)
          test "$count" -eq "${{ inputs.sdk_target && inputs.sdk_target != 'both' && 1 || 2 }}"
          test "$(find release-assets -type f -name '*.apk' | wc -l)" -eq "$((count * 4))"
          find release-assets -type f -name '*.apk' -print

      - name: Prepare release notes
        env:
          RELEASE_SDK: ${{ inputs.sdk_version || '25.12.5' }}
          RELEASE_TARGET: ${{ inputs.sdk_target && inputs.sdk_target != 'both' && inputs.sdk_target || 'x86/64, rockchip/armv8' }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('build-{0}-{1}', github.run_id, github.run_attempt) || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          notes = Path('CHANGELOG.md').read_text(encoding='utf-8')
          metadata = (
              f"\n\n## 构建信息\n\n"
              f"- OpenWrt SDK: {os.environ['RELEASE_SDK']}\n"
              f"- Target: {os.environ['RELEASE_TARGET']}\n"
              f"- Commit: {os.environ['GITHUB_SHA']}\n\n"
              "Kernel modules for zen-traffic must match the firmware build.\n"
          )
          Path('release-notes.md').write_text(notes + metadata, encoding='utf-8')
          PY
          python3 tools/make-release-metadata.py --assets release-assets --merge-builds --tag "$RELEASE_TAG" --notes release-notes.md
          (cd release-assets && find . -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('build-{0}-{1}', github.run_id, github.run_attempt) || github.ref_name }}
          # Existing v* tags already pin the build commit. Resolving an older
          # workflow SHA here can require Workflows:write, unavailable to GITHUB_TOKEN.
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          name: "${{ github.event_name == 'workflow_dispatch' && format('SDK build #{0} ({1})', github.run_number, inputs.sdk_target || 'both') || github.ref_name }}"
          body_path: release-notes.md
          files: |
            release-assets/**/*.apk
            release-assets/zen-update.json
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true

  repository:
    name: "Publish signed APK feed (${{ matrix.sdk_target }})"
    needs: [zen-traffic]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sdk_target: ${{ inputs.sdk_target && inputs.sdk_target != 'both' && fromJSON(format('["{0}"]', inputs.sdk_target)) || fromJSON('["x86/64","rockchip/armv8"]') }}
    concurrency:
      group: zen-feed-${{ inputs.sdk_version }}-${{ matrix.sdk_target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: zen-signed-repository-${{ strategy.job-index }}
          path: repository
      - name: Publish packages before replacing the index
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_VERSION: ${{ inputs.sdk_version }}
          SDK_TARGET: ${{ matrix.sdk_target }}
        run: |
          set -euo pipefail
          [[ "$SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SDK_TARGET" =~ ^[a-z0-9_-]+/[a-z0-9_-]+$ ]]
          tag="feed-openwrt-${SDK_VERSION}-${SDK_TARGET//\//-}"
          printf 'Zen APK feed for OpenWrt %s, target %s. Kernel modules come from the matching firmware feed.\n' "$SDK_VERSION" "$SDK_TARGET" > feed-notes.md
          python3 tools/make-release-metadata.py --assets repository --target "$SDK_TARGET" --sdk-version "$SDK_VERSION" --tag "$tag" --notes feed-notes.md
          previous=$(mktemp -d)
          trap 'rm -rf "$previous"' EXIT
          channel_exists=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            channel_exists=true
            gh release view "$tag" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY" > "$previous/assets"
            if grep -qx zen-update.json "$previous/assets"; then
              gh release download "$tag" --pattern zen-update.json --dir "$previous" --repo "$GITHUB_REPOSITORY"
              python3 tools/check-feed-update.py repository/zen-update.json "$previous/zen-update.json"
            elif grep -qx packages.adb "$previous/assets"; then
              echo 'Active feed has no version record; refusing unsafe replacement'; exit 1
            fi
            if grep -qx zen-repository.pem "$previous/assets"; then
              gh release download "$tag" --pattern zen-repository.pem --dir "$previous" --repo "$GITHUB_REPOSITORY"
              cmp repository/zen-repository.pem "$previous/zen-repository.pem" || { echo 'Repository key changed; explicit key rotation required'; exit 1; }
            elif grep -qx packages.adb "$previous/assets"; then
              echo 'Active feed has no public key; refusing unsafe replacement'; exit 1
            fi
          fi
          build_tag=$(cat repository/build-tag.txt)
          # The index points to immutable build assets. Cached indexes remain usable.
          gh release create "$build_tag" repository/*.apk repository/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$build_tag" --notes-file feed-notes.md \
            --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
          if [ "$channel_exists" = false ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file feed-notes.md --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$tag" repository/zen-repository.pem tools/install-zen.sh --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$tag" repository/packages.adb repository/zen-update.json --clobber --repo "$GITHUB_REPOSITORY"
          printf 'Public key SHA256: %s\n' "$(sha256sum repository/zen-repository.pem | cut -d ' ' -f1)" >> feed-notes.md
          gh release edit "$tag" --notes-file feed-notes.md --repo "$GITHUB_REPOSITORY"
          printf 'APK feed: https://github.com/%s/releases/download/%s/packages.adb\n' "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
